<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BCH Intents Protocol</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/bchintentslogo_edited.png" />
  <link rel="apple-touch-icon" href="/assets/bchintentslogo_edited.png" />

  <!-- PWA -->
  <meta name="theme-color" content="#00d17a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BCH Intents" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- SEO / social -->
  <meta name="description" content="Intent-based cross-chain swaps on Bitcoin Cash. Trustless, instant, non-custodial." />
  <meta property="og:title" content="BCH Intents Protocol" />
  <meta property="og:description" content="Intent-based cross-chain swaps on Bitcoin Cash" />
  <meta property="og:image" content="/assets/bchintentslogo_edited.png" />
  <meta name="twitter:card" content="summary" />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3Z4GNLETPH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3Z4GNLETPH');
    window.__splashStart = Date.now();
  </script>

  <!-- Splash screen styles — inlined so they render before any JS/CSS bundle loads -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Background radial glow */
    #splash::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 60%, rgba(0, 209, 122, 0.08) 0%, transparent 70%);
      animation: splash-glow-breathe 2.5s ease-in-out infinite;
    }

    @keyframes splash-glow-breathe {
      0%, 100% { opacity: 0.6; }
      50%       { opacity: 1; }
    }

    #splash-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      position: relative;
      z-index: 1;
    }

    /* Logo wrapper — holds logo + spinning ring */
    #splash-logo-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 0;
      animation: splash-logo-enter 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }

    @keyframes splash-logo-enter {
      from { opacity: 0; transform: scale(0.45) translateY(10px); }
      to   { opacity: 1; transform: scale(1)    translateY(0);    }
    }

    #splash-logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      display: block;
      filter: drop-shadow(0 0 18px rgba(0, 209, 122, 0.45));
    }

    /* Spinning ring around logo */
    #splash-ring {
      position: absolute;
      inset: -6px;
      border-radius: 28px;
      border: 2px solid transparent;
      border-top-color: rgba(0, 209, 122, 0.7);
      border-right-color: rgba(0, 209, 122, 0.2);
      animation: splash-ring-spin 1.4s linear infinite;
    }

    @keyframes splash-ring-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes splash-text-enter {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Exit animation ─────────────────────────────────────── */
    #splash.splash-exit {
      animation: splash-exit-fade 0.55s cubic-bezier(0.4, 0, 0.6, 1) forwards;
      pointer-events: none;
    }

    #splash.splash-exit #splash-inner {
      animation: splash-inner-exit 0.45s cubic-bezier(0.4, 0, 1, 1) forwards;
    }

    @keyframes splash-exit-fade {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes splash-inner-exit {
      0%   { opacity: 1; transform: scale(1)    translateY(0);     }
      100% { opacity: 0; transform: scale(0.88) translateY(-16px); }
    }
  </style>
</head>

<body>
  <!-- Splash screen — visible before React bundle loads -->
  <div id="splash">
    <div id="splash-inner">
      <div id="splash-logo-wrap">
        <img id="splash-logo" src="/assets/bchintentslogo_edited.png" alt="BCH Intents" />
        <div id="splash-ring"></div>
      </div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
