<?xml version="1.0" encoding="utf-8"?>
<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#080c16"/>
            <stop offset="50%" stop-color="#0d1424"/>
            <stop offset="100%" stop-color="#070a12"/>
        </linearGradient>

        <radialGradient id="glowGrad1" cx="85%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.32"/>
            <stop offset="70%" stop-color="#0d1424" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glowGrad2" cx="15%" cy="85%" r="50%">
            <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14"/>
            <stop offset="80%" stop-color="#080c16" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
            <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
        </linearGradient>

        <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
        </pattern>
    </defs>

    <!-- Canvas Background -->
    <rect width="1200" height="750" fill="url(#bgGrad)"/>
    <rect width="1200" height="750" fill="url(#gridPattern)"/>

    <!-- Ambient Glows -->
    <rect width="1200" height="750" fill="url(#glowGrad1)"/>
    <rect width="1200" height="750" fill="url(#glowGrad2)"/>

    <!-- Top Ambient Accent Line -->
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#8b5cf6" stroke-width="4" opacity="0.85"/>

    <!-- Left Header Meta / Category Pill -->
    <g transform="translate(80, 75)">
        <rect x="0" y="0" width="230" height="34" rx="17" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <circle cx="17" cy="17" r="5" fill="#8b5cf6"/>
        <text x="32" y="22" fill="#e2e8f0" font-size="11" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="1.5">BCHMESH &amp; LIQUIDITY</text>
    </g>

    <!-- Right Brand Badge -->
    <g transform="translate(870, 75)">
        <rect x="0" y="0" width="250" height="34" rx="17" fill="rgba(10, 193, 142, 0.08)" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
        <text x="125" y="22" fill="#8b5cf6" font-size="11" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="1.5" text-anchor="middle">SHARED MESH</text>
    </g>

    <!-- Title Block (Left Column) -->
    <text x="80" y="220" fill="#ffffff" font-size="38" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="-0.5">
        <tspan x="80" dy="0">The Multi-Market Shared</tspan><tspan x="80" dy="46">Liquidity Mesh: One</tspan><tspan x="80" dy="46">Balance, Multiple Pairs</tspan>
    </text>

    <!-- Summary Block -->
    <text x="80" y="440" fill="#94a3b8" font-size="17" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
        <tspan x="80" dy="0">Deploy single-sided inventory that</tspan><tspan x="80" dy="26">simultaneously quotes across multiple</tspan><tspan x="80" dy="26">trading pairs without splitting your</tspan><tspan x="80" dy="26">capital or risking dou...</tspan>
    </text>

    <!-- Protocol Footer Indicator -->
    <g transform="translate(80, 600)">
        <rect x="0" y="0" width="340" height="42" rx="21" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
        <text x="24" y="26" fill="#cbd5e1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">BCHMesh Liquidity Layer</text>
        <circle cx="215" cy="21" r="3" fill="#64748b"/>
        <text x="230" y="26" fill="#8b5cf6" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700">Verified</text>
    </g>

    <!-- Right Column: Bento Graphic Box & Token Badges -->
    <g transform="translate(660, 150)">
        <rect x="0" y="0" width="460" height="490" rx="24" fill="url(#glassGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
        <circle cx="230" cy="180" r="160" fill="#8b5cf6" opacity="0.08"/>

        <!-- Token Pair Floating Spheres -->
        <g transform="translate(140, 50)">
            <circle cx="60" cy="60" r="48" fill="#131b2e" stroke="#8b5cf6" stroke-width="3"/>
            <image href="data:image/svg+xml;base64," x="22" y="22" width="76" height="76"/>

            
            <circle cx="135" cy="60" r="40" fill="#131b2e" stroke="rgba(255,255,255,0.3)" stroke-width="2.5"/>
            <image href="data:image/svg+xml;base64," x="103" y="28" width="64" height="64"/>
            
        </g>

        <!-- Visual Diagram in the Bento box -->
        
                <g transform="translate(670, 420)">
                    <line x1="120" y1="70" x2="30" y2="20" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
                    <line x1="120" y1="70" x2="210" y2="20" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
                    <line x1="120" y1="70" x2="40" y2="130" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
                    <line x1="120" y1="70" x2="200" y2="130" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
                    <line x1="30" y1="20" x2="210" y2="20" stroke="rgba(255,255,255,0.15)" stroke-dasharray="3,3"/>
                    <line x1="40" y1="130" x2="200" y2="130" stroke="rgba(255,255,255,0.15)" stroke-dasharray="3,3"/>
                    <circle cx="30" cy="20" r="14" fill="#131b2e" stroke="#8b5cf6" stroke-width="2"/>
                    <circle cx="210" cy="20" r="14" fill="#131b2e" stroke="#8b5cf6" stroke-width="2"/>
                    <circle cx="40" cy="130" r="14" fill="#131b2e" stroke="#8b5cf6" stroke-width="2"/>
                    <circle cx="200" cy="130" r="14" fill="#131b2e" stroke="#8b5cf6" stroke-width="2"/>
                    <circle cx="120" cy="70" r="26" fill="#8b5cf6" opacity="0.25"/>
                    <circle cx="120" cy="70" r="18" fill="#131b2e" stroke="#fff" stroke-width="2.5"/>
                    <circle cx="120" cy="70" r="6" fill="#8b5cf6"/>
                </g>
            

        <!-- Bottom Metric Glass Badges -->
        <g transform="translate(30, 375)">
            <rect x="0" y="0" width="190" height="85" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
            <text x="18" y="32" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500">Inventory Reuse</text>
            <text x="18" y="64" fill="#8b5cf6" font-size="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800">1 Balance / N Pairs</text>

            <rect x="210" y="0" width="190" height="85" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
            <text x="228" y="32" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500">Double Spend Risk</text>
            <text x="228" y="64" fill="#ffffff" font-size="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800">0% (Atomic UTXO)</text>
        </g>
    </g>

    <rect x="660" y="640" width="460" height="2" fill="#8b5cf6" opacity="0.4"/>
</svg>