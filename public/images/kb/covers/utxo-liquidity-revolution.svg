        <tspan x="80" dy="0">How UTXO-native concentrated liquidity</tspan><tspan x="80" dy="26">eliminates 50/50 token splitting, gives</tspan><tspan x="80" dy="26">LPs 100% direct fee retention, and ends</tspan><tspan x="80" dy="26">impermanent l...</tspan>
    </text>

