        <g transform="translate(140, 50)">
            <circle cx="60" cy="60" r="48" fill="#131b2e" stroke="#0ac18e" stroke-width="3"/>
            <image href="data:image/svg+xml;base64," x="22" y="22" width="76" height="76"/>

            
            <circle cx="135" cy="60" r="40" fill="#131b2e" stroke="rgba(255,255,255,0.3)" stroke-width="2.5"/>
            <image href="data:image/svg+xml;base64," x="103" y="28" width="64" height="64"/>
            
        </g>

        <!-- Visual Diagram in the Bento box -->
        
                <g transform="translate(680, 415)">
                    <path d="M 0,130 Q 80,120 120,70 T 240,10" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-dasharray="4,4"/>
                    <path d="M 0,130 H 40 V 100 H 90 V 70 H 150 V 40 H 200 V 15 H 240" fill="none" stroke="#0ac18e" stroke-width="3.5"/>
                    <circle cx="40" cy="100" r="5" fill="#0ac18e"/>
                    <circle cx="90" cy="70" r="5" fill="#0ac18e"/>
                    <circle cx="150" cy="40" r="6" fill="#fff"/>
